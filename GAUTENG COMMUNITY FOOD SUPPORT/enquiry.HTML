<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send an Enquiry — Gauteng Community Food Support</title>
    <meta name="description" content="Have a question or want to get involved? Send us an enquiry.">
    <meta name="keywords" content="contact, volunteer, donate, enquiry">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">Gauteng Community Food Support</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html" class="active">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>


    <img src="images/ENQUIRY.jpeg" alt="enquiry" style="width: 100%;;max-width: 1000px; border-radius: 8px; margin: 15px 0;">
    <h1>Send Us an Enquiry</h1>
    <p>Have a question or want to get involved? Fill in the form below and we will get back to you.</p>

    <form id="enquiryForm" action="#" method="POST">
        <!-- how to do an enquiry-->
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required minlength="2">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="subject">Subject</label>
        <!-- options of what you are enquiring for -->
        <select id="subject" name="subject" required>
            <option value="">-- Select a topic --</option>
            <option value="General Enquiry">General Enquiry</option>
            <option value="Volunteering">Volunteering</option>
            <option value="Donations">Make a Donation</option>
            <option value="Partnership">Community Partnership</option>
        </select>

        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

        <button type="submit">Send Enquiry</button>
        
        <p id="errorMsg" style="color: red; display: none; margin-top: 15px;"></p>
        <p id="successMsg" style="color: green; display: none; margin-top: 15px;"></p>
    </form>
    <!-- JavaScript-->
    <script>
    var form = document.getElementById('enquiryForm');
    var errorMsg = document.getElementById('errorMsg');
    var successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        var fullname = document.getElementById('fullname').value;
        var email = document.getElementById('email').value;
        var phone = document.getElementById('phone').value;
        var subject = document.getElementById('subject').value;
        var message = document.getElementById('message').value;

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (fullname.length < 2) {
            errorMsg.textContent = 'Please enter your full name.';
            errorMsg.style.display = 'block';
            return;
        }

        if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
            errorMsg.textContent = 'Please enter a valid email address.';
            errorMsg.style.display = 'block';
            return;
        }

        if (phone.length < 10) {
            errorMsg.textContent = 'Please enter a valid phone number.';
            errorMsg.style.display = 'block';
            return;
        }

        if (subject === '') {
            errorMsg.textContent = 'Please select a subject.';
            errorMsg.style.display = 'block';
            return;
        }

        if (message.length < 10) {
            errorMsg.textContent = 'Please write a message of at least 10 characters.';
            errorMsg.style.display = 'block';
            return;
        }

        var responseMessage = '';
        if (subject === 'Volunteering') {
            responseMessage = 'Thank you ' + fullname + '! We would love to have you join our volunteer team. We will send opportunities to ' + email + ' within 48 hours.';
        } else if (subject === 'Donations') {
            responseMessage = 'Hi ' + fullname + '! Thank you for considering donating. We will call you on ' + phone + ' to discuss how you can help.';
        } else if (subject === 'Partnership') {
            responseMessage = 'Hello ' + fullname + '! Partnership enquiries are important to us. We will email you a proposal shortly.';
        } else {
            responseMessage = 'Thank you ' + fullname + '! Your enquiry has been received. We will contact you at ' + email + ' or ' + phone + ' soon.';
        }

        successMsg.textContent = '✅ ' + responseMessage;
        successMsg.style.display = 'block';
        form.reset();
    });
    </script>
</main>

<footer>
    <p>&copy; 2026 Gauteng Community Food Support. All rights reserved.</p>

</footer>

</body>
</html>
